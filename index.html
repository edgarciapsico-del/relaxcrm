<!DOCTYPE html>
<html>
<body>
    <input type="file" id="file" onchange="upload(event)">
    <div id="status"></div>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = supabase.createClient("https://eqhsgpwoehcryhmibfhn.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxaHNncHdvZWhjcnlobWliZmhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjQzMDAsImV4cCI6MjEwMjU0MDMwMH0.7a92b2-4c87-8143-2fed1056cc25");

        async function upload(e) {
            const wb = XLSX.read(await e.target.files[0].arrayBuffer(), {type: 'array'});
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            
            for(let row of rows) {
                // Mapeo directo para evitar errores de columnas faltantes
                let data = {
                    crm_id: String(row.id || ""),
                    name: String(row.name || "Sin nombre"),
                    phone: String(row.phone || ""),
                    phase: String(row.phase || ""),
                    value: String(row.value || ""),
                    date: String(row.date || ""),
                    loss: String(row.loss || ""),
                    gestor: String(row.gestor || ""),
                    a1: String(row.a1 || ""),
                    a2: String(row.a2 || ""),
                    a3: String(row.a3 || ""),
                    a4: String(row.a4 || ""),
                    observaciones: String(row.desc || ""),
                    a5: String(row.a5 || "")
                };
                await supabase.from('pacientes_crm').insert([data]);
            }
            alert("Carga completada.");
        }
    </script>
</body>
</html>
