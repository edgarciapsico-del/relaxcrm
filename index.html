<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Relax CRM - Sincronizador v29</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 p-5">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-lg text-center">
        <h2 id="status" class="font-bold text-lg mb-4 text-indigo-600">Conectando con la nube...</h2>
        <div id="loader" class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mx-auto"></div>
        <p class="text-xs text-slate-400 mt-4">Si esto persiste, revisa tu conexión a internet.</p>
    </div>

    <script>
        const supabase = supabase.createClient("https://eqhsgpwoehcryhmibfhn.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxaHNncHdvZWhjcnlobWliZmhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjQzMDAsImV4cCI6MjEwMjU0MDMwMH0.7a92b2-4c87-8143-2fed1056cc25");

        async function sync() {
            const status = document.getElementById('status');
            try {
                // Obligamos a que el sistema espere la respuesta real del servidor
                const { data, error } = await supabase.from('pacientes_crm').select('*');
                
                if (error) throw error;
                
                status.innerText = "¡Conexión exitosa! Sincronizados " + data.length + " pacientes.";
                document.getElementById('loader').style.display = 'none';
                
                // Aquí el CRM empezaría a pintar los datos...
                console.log("Datos recibidos:", data);
            } catch (err) {
                status.className = "font-bold text-lg mb-4 text-red-600";
                status.innerText = "Error de conexión: " + err.message;
            }
        }
        sync();
    </script>
</body>
</html>
