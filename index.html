<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Relax CRM v26.0 - Auto Mapeo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 p-10">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
        <h1 class="text-2xl font-black text-slate-800 mb-4">Panel de Sincronización</h1>
        <div id="status-box" class="p-4 mb-4 rounded-xl font-bold bg-amber-100 text-amber-800">Cargando motor de conexión...</div>
        <input type="file" id="file-uploader" accept=".xlsx,.csv" onchange="importDataEngine(event)" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
    </div>

    <script>
        const SUPABASE_URL = "https://eqhsgpwoehcryhmibfhn.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxaHNncHdvZWhjcnlobWliZmhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjQzMDAsImV4cCI6MjEwMjU0MDMwMH0.7a92b2-4c87-8143-2fed1056cc25";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function importDataEngine(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const wb = XLSX.read(data, {type: 'array'});
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                
                document.getElementById('status-box').innerText = "Procesando " + rows.length + " filas...";
                
                for(let row of rows) {
                    // Mapeo flexible: busca palabras clave en las columnas
                    let payload = {
                        name: row.name || row.nombre || row.Nombre || "Sin Nombre",
                        phone: String(row.phone || row.telefono || row.WhatsApp || ""),
                        phase: (row.phase || row.estado || "frio").toLowerCase(),
                        value: parseFloat(row.value || row.valor || 0),
                        gestor: row.gestor || row.asesora || "Brenda",
                        observaciones: row.desc || row.observaciones || ""
                    };
                    
                    // IMPORTANTE: Quitamos el ID del Excel para que Supabase asigne el suyo propio
                    const { error } = await supabase.from('pacientes_crm').insert([payload]);
                    if(error) console.error("Error en fila:", error);
                }
                document.getElementById('status-box').className = "p-4 rounded-xl font-bold bg-emerald-100 text-emerald-800";
                document.getElementById('status-box').innerText = "¡Carga exitosa! Datos sincronizados en la nube.";
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
