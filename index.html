<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relax Therapy CRM Master - Versión Unificada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }
        .kanban-column { min-width: 295px; }
        .scrollbar-custom::-webkit-scrollbar { height: 8px; width: 6px; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <header class="bg-white border-b sticky top-0 z-40 shadow-sm">
        <div class="max-w-[1750px] mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><i class="fa-solid fa-database"></i></div>
                <div>
                    <h1 class="font-black text-lg">RELAX THERAPY CRM MASTER</h1>
                    <span id="sync-status" class="text-[10px] text-emerald-600 font-bold uppercase">Sistema Listo</span>
                </div>
            </div>
            <div class="flex gap-2">
                <input type="file" id="file-uploader" onchange="importDataEngine(event)" class="text-xs border p-2 rounded-xl">
                <button onclick="location.reload()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-xs">REFRESCAR</button>
                <button onclick="resetDB()" class="bg-red-600 text-white px-4 py-2 rounded-xl font-bold text-xs">⚠️ RESET</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-[1750px] w-full mx-auto p-4 overflow-x-auto">
        <div class="flex gap-4 pb-6 scrollbar-custom">
            <div class="kanban-column bg-slate-200 p-3 rounded-2xl min-h-[500px]"><h2 class="font-bold text-xs uppercase mb-3">Frío</h2><div id="col-frio" class="space-y-3"></div></div>
            <div class="kanban-column bg-slate-200 p-3 rounded-2xl min-h-[500px]"><h2 class="font-bold text-xs uppercase mb-3">Tibio</h2><div id="col-tibio" class="space-y-3"></div></div>
            <div class="kanban-column bg-slate-200 p-3 rounded-2xl min-h-[500px]"><h2 class="font-bold text-xs uppercase mb-3">Caliente</h2><div id="col-caliente" class="space-y-3"></div></div>
            <div class="kanban-column bg-blue-200 p-3 rounded-2xl min-h-[500px]"><h2 class="font-bold text-xs uppercase mb-3 text-blue-800">Agenda</h2><div id="col-agenda" class="space-y-3"></div></div>
            <div class="kanban-column bg-green-200 p-3 rounded-2xl min-h-[500px]"><h2 class="font-bold text-xs uppercase mb-3 text-green-800">Venta</h2><div id="col-venta" class="space-y-3"></div></div>
            <div class="kanban-column bg-purple-200 p-3 rounded-2xl min-h-[500px]"><h2 class="font-bold text-xs uppercase mb-3 text-purple-800">Post Venta</h2><div id="col-postventa" class="space-y-3"></div></div>
        </div>
    </main>

    <script>
        const sb = supabase.createClient("https://eqhsgpwoehcryhmibfhn.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxaHNncHdvZWhjcnlobWliZmhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjQzMDAsImV4cCI6MjEwMjU0MDMwMH0.7a92b2-4c87-8143-2fed1056cc25");

        async function importDataEngine(e) {
            const file = e.target.files[0];
            const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            
            let cargados = 0;
            let errores = 0;

            for(let row of rows) {
                let idVal = parseInt(row.id);
                if (isNaN(idVal)) {
                    console.warn("Fila corrupta ignorada:", row);
                    errores++;
                    continue;
                }

                let data = {
                    crm_id: String(idVal),
                    name: String(row.name || "Sin nombre"),
                    phone: String(row.phone || ""),
                    phase: String(row.phase || "frio").toLowerCase().trim(),
                    value: String(row.value || "0"),
                    date: String(row.date || ""),
                    loss: String(row.loss || "Ninguno"),
                    gestor: String(row.gestor || "Brenda"),
                    a1: String(row.a1 || "0"), a2: String(row.a2 || "0"),
                    a3: String(row.a3 || "0"), a4: String(row.a4 || "0"),
                    a5: String(row.a5 || "0"),
                    touch: "1",
                    observaciones: String(row.desc || row.observaciones || "")
                };
                
                let { error } = await sb.from('pacientes_crm').insert([data]);
                if(!error) cargados++;
            }
            alert("Carga Finalizada: " + cargados + " cargados. " + errores + " errores saltados.");
            location.reload();
        }

        async function cargarTablero() {
            let { data } = await sb.from('pacientes_crm').select('*');
            if(!data) return;
            data.forEach(item => {
                let col = document.getElementById('col-' + (item.phase || 'frio'));
                if(col) col.innerHTML += `<div class="bg-white p-2 mb-1 rounded shadow text-[10px] font-bold">${item.name}</div>`;
            });
        }

        async function resetDB() {
            if(!confirm("¿Borrar todos los datos de la nube?")) return;
            await sb.from('pacientes_crm').delete().neq('id', -1);
            location.reload();
        }

        cargarTablero();
    </script>
</body>
</html>
