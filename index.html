<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Relax Therapy CRM Cloud - v25.2 Supabase Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }
        .kanban-column { min-width: 295px; max-width: 350px; }
        .scrollbar-custom::-webkit-scrollbar { height: 8px; width: 6px; }
        .scrollbar-custom::-webkit-scrollbar-track { background: #f1f5f9; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
        <div class="max-w-[1750px] mx-auto px-4 lg:px-8 h-20 flex flex-col sm:flex-row items-center justify-between gap-4 py-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-database text-lg"></i>
                </div>
                <div>
                    <span class="font-black text-slate-900 tracking-tight text-lg">RELAX THERAPY CRM MASTER</span>
                    <span id="sync-status" class="block text-[11px] font-bold text-indigo-600 uppercase tracking-wider"><i class="fa-solid fa-bolt"></i> v25.2 Conectado a Supabase</span>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 text-xs">
                <div class="flex items-center gap-2 bg-slate-50 border px-3 py-1.5 rounded-xl border-slate-200 shadow-2xs">
                    <i class="fa-solid fa-file-excel text-emerald-600 font-bold"></i>
                    <input type="file" id="file-uploader" accept=".xlsx,.xls,.csv" onchange="importDataEngine(event)" class="w-40 text-slate-600 text-[11px] cursor-pointer">
                </div>
                <button onclick="loadDataFromCloud()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 h-10 rounded-xl font-bold flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-arrows-rotate"></i> Sincronizar Base Datos
                </button>
                <button onclick="resetDB()" class="bg-red-600 text-white px-4 h-10 rounded-xl font-bold text-xs">⚠️ RESET CLOUD</button>
            </div>
        </div>
    </header>

    <section class="max-w-[1750px] w-full mx-auto px-4 lg:px-8 mt-4">
        <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl flex flex-col md:flex-row items-center justify-between gap-4 text-xs">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-key text-amber-600 text-sm"></i>
                <div>
                    <strong class="text-amber-900 block">Llaves de Conexión de tu Servidor</strong>
                    <span class="text-amber-700 font-medium">Inserta las llaves que te da Supabase para enlazar tu CRM comercial.</span>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <input type="text" id="db-url" placeholder="Tu Supabase URL" class="px-3 h-9 bg-white border border-amber-300 rounded-lg w-64 font-mono focus:outline-hidden">
                <input type="password" id="db-key" placeholder="Tu Supabase Anon Key" class="px-3 h-9 bg-white border border-amber-300 rounded-lg w-64 font-mono focus:outline-hidden">
                <button onclick="saveConnectionCredentials()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold h-9 px-4 rounded-lg transition-all">Enlazar Servidor</button>
            </div>
        </div>
    </section>

    <main class="flex-1 max-w-[1750px] w-full mx-auto px-4 lg:px-8 py-4 overflow-x-auto">
        <div class="flex gap-4 pb-6 items-start scrollbar-custom">
            <div class="kanban-column bg-slate-100 p-3 rounded-2xl flex flex-col min-h-[500px] border">
                <div class="flex items-center justify-between mb-3 px-1 font-bold text-xs uppercase text-slate-600"><span>Frío</span><span id="b-frio" class="bg-white px-2 py-0.5 rounded border">0</span></div>
                <div id="col-frio" class="space-y-3 flex-grow overflow-y-auto max-h-[550px]"></div>
            </div>
            <div class="kanban-column bg-slate-100 p-3 rounded-2xl flex flex-col min-h-[500px] border">
                <div class="flex items-center justify-between mb-3 px-1 font-bold text-xs uppercase text-slate-600"><span>Tibio</span><span id="b-tibio" class="bg-white px-2 py-0.5 rounded border">0</span></div>
                <div id="col-tibio" class="space-y-3 flex-grow overflow-y-auto max-h-[550px]"></div>
            </div>
            <div class="kanban-column bg-slate-100 p-3 rounded-2xl flex flex-col min-h-[500px] border">
                <div class="flex items-center justify-between mb-3 px-1 font-bold text-xs uppercase text-slate-600"><span>Caliente</span><span id="b-caliente" class="bg-white px-2 py-0.5 rounded border">0</span></div>
                <div id="col-caliente" class="space-y-3 flex-grow overflow-y-auto max-h-[550px]"></div>
            </div>
            <div class="kanban-column bg-indigo-50/60 p-3 rounded-2xl flex flex-col min-h-[500px] border border-indigo-100">
                <div class="flex items-center justify-between mb-3 px-1 font-bold text-xs uppercase text-indigo-700"><span>Agenda</span><span id="b-agenda" class="bg-white px-2 py-0.5 rounded border">0</span></div>
                <div id="col-agenda" class="space-y-3 flex-grow overflow-y-auto max-h-[550px]"></div>
            </div>
            <div class="kanban-column bg-emerald-50/60 p-3 rounded-2xl flex flex-col min-h-[500px] border border-emerald-100">
                <div class="flex items-center justify-between mb-3 px-1 font-bold text-xs uppercase text-emerald-700"><span>Venta</span><span id="b-venta" class="bg-white px-2 py-0.5 rounded border">0</span></div>
                <div id="col-venta" class="space-y-3 flex-grow overflow-y-auto max-h-[550px]"></div>
            </div>
            <div class="kanban-column bg-purple-50/60 p-3 rounded-2xl flex flex-col min-h-[500px] border border-purple-100">
                <div class="flex items-center justify-between mb-3 px-1 font-bold text-xs uppercase text-purple-700"><span>Post Venta</span><span id="b-postventa" class="bg-white px-2 py-0.5 rounded border">0</span></div>
                <div id="col-postventa" class="space-y-3 flex-grow overflow-y-auto max-h-[550px]"></div>
            </div>
        </div>
    </main>

    <script>
        let supabaseClient = null;
        let mainLeadsRegistry = [];

        window.onload = function() {
            initSupabaseEngine();
        };

        function initSupabaseEngine() {
            let savedUrl = localStorage.getItem('relax_supabase_url');
            let savedKey = localStorage.getItem('relax_supabase_key');
            if(savedUrl && savedKey) {
                document.getElementById('db-url').value = savedUrl;
                document.getElementById('db-key').value = savedKey;
                supabaseClient = supabase.createClient(savedUrl, savedKey);
                loadDataFromCloud();
            } else {
                document.getElementById('sync-status').innerHTML = "⚠️ Falta enlazar las llaves de Supabase";
            }
        }

        function saveConnectionCredentials() {
            let url = document.getElementById('db-url').value.trim();
            let key = document.getElementById('db-key').value.trim();
            if(!url || !key) { alert("Por favor inserta ambas llaves."); return; }
            localStorage.setItem('relax_supabase_url', url);
            localStorage.setItem('relax_supabase_key', key);
            location.reload();
        }

        // MOTOR DE IMPORTACIÓN COMPATIBLE POR CABECERAS (Resuelve el error de mapeo)
        async function importDataEngine(e) {
            if(!supabaseClient) { alert("Configura las llaves de Supabase primero."); return; }
            const file = e.target.files[0];
            const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
            
            // Forzar lectura basada en objetos con nombres de columnas directos
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            
            let cargados = 0; let errores = 0;
            document.getElementById('sync-status').innerHTML = "⏳ Subiendo datos a la nube...";

            for(let row of rows) {
                let idVal = parseInt(row.id);
                if (isNaN(idVal)) { errores++; continue; }

                let data = {
                    crm_id: String(idVal),
                    name: String(row.name || "Sin nombre"),
                    phone: String(row.phone || ""),
                    phase: String(row.phase || "frio").toLowerCase().replace(/\s/g, '').trim(),
                    value: String(row.value || "0"),
                    date: String(row.date || ""),
                    loss: String(row.loss || "Ninguno"),
                    gestor: String(row.gestor || "Brenda"),
                    a1: String(row.a1 || "0"), a2: String(row.a2 || "0"),
                    a3: String(row.a3 || "0"), a4: String(row.a4 || "0"), a5: String(row.a5 || "0"),
                    touch: String(row.touch || "1"),
                    observaciones: String(row.desc || row.observaciones || "")
                };
                
                let { error } = await supabaseClient.from('pacientes_crm').insert([data]);
                if(!error) cargados++; else { console.error(error); errores++; }
            }
            alert("Carga completada con éxito. Registros subidos: " + cargados + ". Errores: " + errores);
            loadDataFromCloud();
        }

        async function loadDataFromCloud() {
            if(!supabaseClient) return;
            try {
                let { data, error } = await supabaseClient.from('pacientes_crm').select('*');
                if(error) throw error;
                mainLeadsRegistry = data;
                renderTablero();
            } catch(e) { console.error(e); }
        }

        function renderTablero() {
            const phases = ['frio', 'tibio', 'caliente', 'agenda', 'venta', 'postventa'];
            let phaseCounts = { frio: 0, tibio: 0, caliente: 0, agenda: 0, venta: 0, postventa: 0 };
            
            phases.forEach(p => document.getElementById(`col-${p}`).innerHTML = '');

            mainLeadsRegistry.forEach(item => {
                let currentPhase = String(item.phase || 'frio').toLowerCase().trim();
                if (!phases.includes(currentPhase)) currentPhase = 'frio';

                phaseCounts[currentPhase]++;

                const card = document.createElement('div');
                card.className = "p-3 rounded-xl border bg-white shadow-xs space-y-1 border-slate-200";
                card.innerHTML = `
                    <div class="font-bold text-xs text-slate-800">${item.name}</div>
                    <p class="text-[10px] text-slate-500">${item.observaciones || 'Sin observaciones'}</p>
                    <div class="text-[10px] font-bold text-indigo-600 text-right">$${item.value || 0}</div>`;
                
                document.getElementById(`col-${currentPhase}`).appendChild(card);
            });

            phases.forEach(p => document.getElementById(`b-${p}`).innerText = phaseCounts[p]);
        }

        async function resetDB() {
            if(!confirm("¿Vaciar base cloud?")) return;
            await supabaseClient.from('pacientes_crm').delete().neq('id', -1);
            location.reload();
        }
    </script>
</body>
</html>
