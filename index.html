<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Relax Therapy CRM Cloud - v24.2 Core Restored Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }
        .kanban-column { min-width: 295px; max-width: 350px; }
        .scrollbar-custom::-webkit-scrollbar { height: 8px; width: 6px; }
        .scrollbar-custom::-webkit-scrollbar-track { background: #f1f5f9; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
        <div class="max-w-[1750px] mx-auto px-4 lg:px-8 h-20 flex flex-col sm:flex-row items-center justify-between gap-4 py-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-cloud text-lg"></i>
                </div>
                <div>
                    <span class="font-black text-slate-900 tracking-tight text-lg">RELAX THERAPY CRM MASTER</span>
                    <span id="sync-status" class="block text-[11px] font-bold text-emerald-600 uppercase tracking-wider"><i class="fa-solid fa-circle-check"></i> v24.2 Core Estable Listo</span>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 text-xs">
                <button onclick="toggleConfigPanel()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 h-10 rounded-xl font-bold flex items-center gap-1.5 border transition-all">
                    <i class="fa-solid fa-user-gear text-indigo-600"></i> ⚙️ Configurar Metas Asesoras
                </button>
                <div class="flex items-center gap-2 bg-slate-50 border px-3 py-1.5 rounded-xl border-slate-200 shadow-2xs">
                    <i class="fa-solid fa-file-excel text-emerald-600 font-bold"></i>
                    <input type="file" id="file-uploader" accept=".xlsx,.xls,.csv" onchange="importDataEngine(event)" class="w-40 text-slate-600 text-[11px] cursor-pointer">
                </div>
                <button onclick="forceResetLocalStorage()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 h-10 rounded-xl font-bold flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-arrows-rotate"></i> Forzar Descarga Cloud
                </button>
                <button onclick="loadDataFromCloud()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 h-10 rounded-xl font-bold flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-arrows-rotate"></i> Actualizar Tablero
                </button>
                <button onclick="exportBackupExcel()" class="bg-slate-700 hover:bg-slate-800 text-white px-3 h-10 rounded-xl font-bold flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-file-arrow-down"></i> Exportar Excel
                </button>
                <button onclick="openModal('create')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 h-10 rounded-xl font-bold shadow-xs">
                    <i class="fa-solid fa-plus"></i> Registrar Lead
                </button>
            </div>
        </div>
    </header>

    <section id="config-panel" class="max-w-[1750px] w-full mx-auto px-4 lg:px-8 mt-4 hidden">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
            <h4 class="text-xs font-black text-slate-700 uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-sliders text-indigo-600"></i> Presupuesto Comercial Dinámico por Vendedor</h4>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
                <div class="p-4 bg-slate-50 border rounded-xl space-y-3">
                    <div class="flex items-center gap-2 border-b pb-1"><i class="fa-solid fa-user text-indigo-600 text-xs"></i><input type="text" id="cfg-g1" value="Brenda" onchange="updateEquipoConfig()" class="font-black text-slate-800 bg-transparent focus:outline-hidden text-xs uppercase"></div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div><label class="block text-slate-400 font-bold mb-0.5">Meta Diaria ($)</label><input type="number" id="meta-d-g1" value="50" onchange="updateEquipoConfig()" class="w-full px-2 h-8 bg-white border rounded-lg font-black text-indigo-600"></div>
                        <div><label class="block text-slate-400 font-bold mb-0.5">Meta Mensual ($)</label><input type="number" id="meta-m-g1" value="1100" onchange="updateEquipoConfig()" class="w-full px-2 h-8 bg-white border rounded-lg font-black text-indigo-600"></div>
                    </div>
                </div>

                <div class="p-4 bg-slate-50 border rounded-xl space-y-3">
                    <div class="flex items-center gap-2 border-b pb-1"><i class="fa-solid fa-user text-indigo-600 text-xs"></i><input type="text" id="cfg-g2" value="Joselyne" onchange="updateEquipoConfig()" class="font-black text-slate-800 bg-transparent focus:outline-hidden text-xs uppercase"></div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div><label class="block text-slate-400 font-bold mb-0.5">Meta Diaria ($)</label><input type="number" id="meta-d-g2" value="50" onchange="updateEquipoConfig()" class="w-full px-2 h-8 bg-white border rounded-lg font-black text-indigo-600"></div>
                        <div><label class="block text-slate-400 font-bold mb-0.5">Meta Mensual ($)</label><input type="number" id="meta-m-g2" value="1100" onchange="updateEquipoConfig()" class="w-full px-2 h-8 bg-white border rounded-lg font-black text-indigo-600"></div>
                    </div>
                </div>

                <div class="p-4 bg-slate-50 border rounded-xl space-y-3">
                    <div class="flex items-center gap-2 border-b pb-1"><i class="fa-solid fa-user text-indigo-600 text-xs"></i><input type="text" id="cfg-g3" value="Naty" onchange="updateEquipoConfig()" class="font-black text-slate-800 bg-transparent focus:outline-hidden text-xs uppercase"></div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div><label class="block text-slate-400 font-bold mb-0.5">Meta Diaria ($)</label><input type="number" id="meta-d-g3" value="50" onchange="updateEquipoConfig()" class="w-full px-2 h-8 bg-white border rounded-lg font-black text-indigo-600"></div>
                        <div><label class="block text-slate-400 font-bold mb-0.5">Meta Mensual ($)</label><input type="number" id="meta-m-g3" value="1100" onchange="updateEquipoConfig()" class="w-full px-2 h-8 bg-white border rounded-lg font-black text-indigo-600"></div>
                    </div>
                </div>
            </div>
            <div class="pt-2 border-t text-xs">
                <label class="font-bold text-slate-400">Usuario Administrador Principal:</label>
                <input type="text" id="cfg-g4" value="Fernando" onchange="updateEquipoConfig()" class="ml-2 px-3 py-1 bg-slate-100 border rounded-lg font-bold text-slate-700 uppercase focus:outline-hidden">
            </div>
        </div>
    </section>

    <section class="max-w-[1750px] w-full mx-auto px-4 lg:px-8 mt-4">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 space-y-6 shadow-xs">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <div class="bg-slate-50 p-4 rounded-xl border"><span class="text-[10px] font-bold text-slate-400 uppercase">Pipeline Activo Filtro</span><h3 id="kpi-pipeline" class="text-lg font-black text-slate-800 mt-0.5">$0.00</h3></div>
                
                <div onclick="togglePendingDebtFilter()" id="btn-kpi-sales" class="bg-emerald-50 p-4 rounded-xl border border-emerald-100 cursor-pointer hover:bg-emerald-100/70 transition-all group shadow-2xs select-none">
                    <span class="text-[10px] font-bold text-emerald-600 uppercase flex items-center justify-between">Ingresos Reales Filtro <i class="fa-solid fa-filter text-[9px]"></i></span>
                    <h3 id="kpi-sales" class="text-lg font-black text-emerald-700 mt-0.5">$0.00</h3>
                    <span id="sub-kpi-debt" class="block text-[10px] font-medium text-emerald-600 mt-0.5">Click: Ver por Cobrar</span>
                </div>

                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100"><span class="text-[10px] font-bold text-blue-600 uppercase">Tasa Agendamiento</span><h3 id="kpi-scheduling-rate" class="text-lg font-black text-blue-700 mt-0.5">0%</h3><span id="sub-kpi-agendas" class="block text-[10px] font-medium text-blue-500 mt-0.5">0 Agendas</span></div>
                <div class="bg-violet-50 p-4 rounded-xl border border-violet-100"><span class="text-[10px] font-bold text-violet-6
